  <rect x="40" y="96" width="38" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.5"/>

  <!-- Preview eye icon -->
  <g transform="translate(78, 84)">
    <circle cx="14" cy="14" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M4 14C4 14 8 7 14 7C20 7 24 14 24 14C24 14 20 21 14 21C8 21 4 14 4 14Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

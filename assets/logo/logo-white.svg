<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- White version for dark backgrounds -->
  <!-- Document page shape -->
  <rect x="24" y="16" width="80" height="96" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Heading line -->
  <rect x="40" y="34" width="36" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Text lines -->
  <rect x="40" y="48" width="48" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.5"/>
  <rect x="40" y="56" width="42" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.5"/>
  <rect x="40" y="64" width="46" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.5"/>

  <!-- Second heading -->

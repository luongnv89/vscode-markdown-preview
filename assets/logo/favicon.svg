<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- Minimal favicon - document with eye -->
  <rect width="16" height="16" rx="3" fill="#0A0A0A"/>

  <!-- Document -->
  <rect x="3" y="2" width="10" height="12" rx="1.5" fill="#18181B" stroke="#374151" stroke-width="0.5"/>

  <!-- Heading line -->
  <rect x="5" y="4" width="5" height="1" rx="0.5" fill="#22C55E"/>

  <!-- Text lines -->
  <rect x="5" y="6.5" width="6" height="0.7" rx="0.35" fill="#6B7280"/>
  <rect x="5" y="8.5" width="5" height="0.7" rx="0.35" fill="#6B7280"/>

  <!-- Eye dot -->
  <circle cx="11" cy="12" r="2" fill="#0A0A0A" stroke="#374151" stroke-width="0.3"/>
  <circle cx="11" cy="12" r="1" fill="#22C55E"/>
</svg>

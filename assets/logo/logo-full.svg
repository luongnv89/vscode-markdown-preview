<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 128" fill="none">
  <!-- Logo mark -->
  <g>
    <!-- Background rounded square -->
    <rect x="4" y="4" width="120" height="120" rx="24" fill="#0A0A0A" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Document page shape -->
    <rect x="28" y="20" width="72" height="88" rx="6" fill="#18181B" stroke="#374151" stroke-width="1.2"/>

    <!-- Heading line -->
    <rect x="40" y="34" width="36" height="4" rx="2" fill="#22C55E"/>

    <!-- Text lines -->
    <rect x="40" y="46" width="48" height="2.5" rx="1.25" fill="#6B7280"/>
    <rect x="40" y="54" width="42" height="2.5" rx="1.25" fill="#6B7280"/>
    <rect x="40" y="62" width="46" height="2.5" rx="1.25" fill="#6B7280"/>

    <!-- Second heading -->
    <rect x="40" y="76" width="28" height="3.5" rx="1.75" fill="#22C55E" opacity="0.8"/>

    <!-- More text lines -->
    <rect x="40" y="86" width="44" height="2.5" rx="1.25" fill="#6B7280"/>
    <rect x="40" y="94" width="38" height="2.5" rx="1.25" fill="#6B7280"/>

    <!-- Preview eye icon -->
    <g transform="translate(82, 82)">
      <circle cx="14" cy="14" r="16" fill="#0A0A0A" stroke="#374151" stroke-width="1"/>
      <path d="M4 14C4 14 8 7 14 7C20 7 24 14 24 14C24 14 20 21 14 21C8 21 4 14 4 14Z" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="14" r="3.5" fill="#22C55E"/>
      <circle cx="12.5" cy="12.5" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(148, 0)">
    <!-- "Markdown" -->
    <text x="0" y="58" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">Markdown</text>
    <!-- "Preview Pro" -->
    <text x="0" y="90" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#6B7280" letter-spacing="-0.3">Preview <tspan fill="#22C55E" font-weight="600">Pro</tspan></text>
  </g>
</svg>

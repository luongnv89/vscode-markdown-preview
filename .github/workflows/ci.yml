name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint src/ webview/

      - name: Type check (src)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type check (webview)
        run: npx tsc --noEmit -p tsconfig.webview.json

      # npm test / coverage launch a real VS Code (Electron) instance via
      # @vscode/test-electron — xvfb provides the headless display on Linux.
      - name: Run tests
        run: xvfb-run -a npm test

      - name: Run coverage
        run: xvfb-run -a npm run coverage

      - name: Build extension
        run: npm run package

      - name: Build landing page
        run: npm run build:landing

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-extension
          path: '*.vsix'
          retention-days: 30
